<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12071d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domino TN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Domino Tunisia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Lalezar&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: tall violet table in an engraved wooden frame, lit from above. Portrait stacks seats / table / hand; landscape puts the table left and controls right. */
  :root {
    --night: #12071d;
    --violet-900: #1d0b31;
    --violet-800: #2b1049;
    --violet-700: #3d1a68;
    --violet-600: #5a2a9a;
    --felt-mid: #3b1766;
    --felt-edge: #170a28;
    --gold-1: #fff1b0;
    --gold-2: #e8bb4f;
    --gold-3: #a8741f;
    --gold-4: #6b4510;
    --pip: #f6eefc;
    --text: #f3e9ff;
    --muted: #b79edb;
    --wood-1: #5a3720;
    --wood-2: #3b2113;
    --wood-3: #26140a;
    --gold-grad: linear-gradient(135deg, #fff1b0 0%, #e8bb4f 28%, #a8741f 52%, #f6d77c 74%, #9a6a1a 100%);
    --font-logo: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --font-engrave: 'Cinzel', Georgia, serif;
    --font-display: 'Lalezar', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    --font-body: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    color-scheme: dark;
  }
  /* Tile skins: default violet & gold, then white, red, wood. Set on <html> and on shop previews via data-tiles. */
  :root {
    --tl-bg: linear-gradient(155deg, #5a2a9a 0%, #3d1a68 45%, #1d0b31 100%);
    --tl-border: #8a5fd0;
    --pip-bg: radial-gradient(circle at 35% 30%, #fff, #f6eefc 55%, #cdb9e6 100%);
    --bar-bg: linear-gradient(135deg, #fff1b0 0%, #e8bb4f 28%, #a8741f 52%, #f6d77c 74%, #9a6a1a 100%);
    --bar-glow: 0 0 4px rgba(255, 215, 110, .65);
    --bk-bg: linear-gradient(160deg, #5a2a9a, #2b1049);
    --bk-border: #a8741f;
  }
  [data-tiles="1"] {
    --tl-bg: linear-gradient(160deg, #ffffff 0%, #f4f1ea 60%, #dcd6c8 100%); --tl-border: #b4ad9c;
    --pip-bg: radial-gradient(circle at 35% 30%, #5a5a5a, #0e0e0e 70%); --bar-bg: #0e0e0e; --bar-glow: none;
    --bk-bg: linear-gradient(160deg, #fbf8f0, #d9d2c2); --bk-border: #8f8776;
  }
  [data-tiles="2"] {
    --tl-bg: linear-gradient(155deg, #e4503f 0%, #b3231c 55%, #7d130f 100%); --tl-border: #f29a8c;
    --pip-bg: radial-gradient(circle at 35% 30%, #fff, #f3e9e6 60%, #d9c4bf 100%); --bar-bg: #0e0e0e; --bar-glow: none;
    --bk-bg: linear-gradient(160deg, #d9402f, #7d130f); --bk-border: #f29a8c;
  }
  [data-tiles="3"] {
    --tl-bg: repeating-linear-gradient(95deg, rgba(70, 35, 10, .2) 0 2px, transparent 2px 6px), linear-gradient(155deg, #deaa6a 0%, #b57a3a 55%, #8a5626 100%); --tl-border: #ecc994;
    --pip-bg: radial-gradient(circle at 35% 30%, #5a4a3a, #120a04 70%); --bar-bg: #1a0f06; --bar-glow: none;
    --bk-bg: linear-gradient(160deg, #c9915a, #7d5124); --bk-border: #ecc994;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--text); font-family: var(--font-body); font-size: 16px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold-2); outline-offset: 2px; }

  .gold-text {
    background: linear-gradient(180deg, #fff3b8 0%, #f0c75a 36%, #b27a1e 62%, #f6d77c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 rgba(40, 20, 0, .75)) drop-shadow(0 0 14px rgba(240, 190, 80, .25));
  }
  .engraved {
    font-family: var(--font-engrave); font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: #c99a3c;
    text-shadow: 0 1px 0 rgba(255, 236, 170, .55), 0 -1px 0 rgba(0, 0, 0, .75);
  }

  /* ---------- App shell ---------- */
  .app {
    height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 8px;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    max-width: 820px; margin: 0 auto;
    background: radial-gradient(120% 70% at 50% 0%, #2a0f48 0%, var(--night) 70%);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .iconbtn {
    flex: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 20px; line-height: 1;
    background: var(--violet-800); border: 1px solid var(--gold-3); display: flex; align-items: center; justify-content: center;
  }
  .iconbtn svg { width: 22px; height: 22px; fill: var(--gold-2); }
  .score {
    display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 78px;
    background: var(--violet-900); border: 1px solid var(--gold-3); border-radius: 12px; padding: 4px 10px;
  }
  .score .row { display: flex; align-items: baseline; gap: 6px; }
  .score span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .score b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.05; color: var(--gold-2); font-variant-numeric: tabular-nums; }
  .wins { display: flex; gap: 4px; }
  .wins u { width: 8px; height: 8px; border-radius: 50%; background: #4a2a78; display: block; }
  .wins u.on { background: var(--gold-grad); box-shadow: 0 0 5px rgba(255, 215, 110, .7); }
  .brand { text-align: center; min-width: 0; flex: 1; }
  .brand h1 { margin: 0; font-family: var(--font-logo); font-weight: 900; font-size: 16px; line-height: 1.1; letter-spacing: .03em; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .botzone { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; min-height: 52px; }
  .seats { display: flex; gap: 6px; align-items: flex-end; justify-content: center; flex: 1; min-width: 0; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 12px; border: 1px solid transparent; min-width: 0; transition: background .2s, border-color .2s; }
  .seat.on { border-color: var(--gold-2); background: rgba(255, 215, 110, .09); }
  .sname { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sbacks { display: flex; align-items: center; min-height: 28px; padding-inline-start: 6px; }
  .back {
    flex: none; width: 15px; height: 28px; border-radius: 4px; margin-inline-start: -6px; position: relative;
    background: var(--bk-bg); border: 1px solid var(--bk-border); box-shadow: 0 1px 0 #0008;
  }
  .back::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: var(--bar-bg); transform: translateY(-50%); }
  .seats.solo .back { width: 22px; height: 42px; margin-inline-start: -7px; }
  .seats.solo .sbacks { min-height: 42px; }
  .bone {
    flex: none; display: flex; align-items: center; gap: 8px; cursor: default; background: transparent;
    border: 1px dashed #6c46a3; border-radius: 12px; padding: 7px 12px; font-size: 14px; color: var(--muted);
  }
  .bone b { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--text); font-variant-numeric: tabular-nums; }
  .bone.live { border-color: var(--gold-2); color: var(--text); cursor: pointer; }

  /* ---------- Table: wooden frame, engraved gold, felt ---------- */
  .boardwrap { position: relative; flex: 1; min-height: 240px; }
  .frame {
    position: absolute; inset: 0; border-radius: 26px; padding: 22px;
    background:
      repeating-linear-gradient(91deg, rgba(0,0,0,.16) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(88deg, rgba(255,210,150,.05) 0 1px, transparent 1px 11px),
      linear-gradient(180deg, var(--wood-1) 0%, var(--wood-2) 45%, var(--wood-3) 100%);
    box-shadow: 0 14px 30px #000b, 0 2px 0 rgba(255, 220, 160, .25) inset, 0 -4px 0 rgba(0, 0, 0, .55) inset, 0 0 0 1px #000;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; border-radius: 20px; padding: 2px; background: var(--gold-grad); pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .frame::before { inset: 6px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.7)); }
  .frame::after { inset: 12px; border-radius: 15px; padding: 1px; opacity: .7; }
  .orn { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); background: var(--gold-grad); border: 1px solid #3a2208; box-shadow: 0 1px 2px #000a; z-index: 2; }
  .orn.tl { top: 1px; left: 1px; } .orn.tr { top: 1px; right: 1px; } .orn.bl { bottom: 1px; left: 1px; } .orn.br { bottom: 1px; right: 1px; }
  .felt {
    position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 10px;
    background: radial-gradient(90% 80% at 50% 38%, var(--felt-mid) 0%, #26104a 55%, var(--felt-edge) 100%);
    box-shadow: 0 0 0 2px var(--gold-4), 0 0 0 3px #000, inset 0 0 50px #000a;
  }
  .cone {
    position: absolute; left: 50%; top: 0; width: 120%; height: 100%; transform: translateX(-50%); pointer-events: none;
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, rgba(255, 233, 170, .20) 0%, rgba(255, 233, 170, .06) 55%, transparent 100%);
  }
  .pool { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 46% at 50% 36%, rgba(255, 226, 150, .22) 0%, rgba(255, 226, 150, .07) 55%, transparent 100%); }
  .world { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; --s: 28px; transition: transform .25s ease; }

  .dealer { position: absolute; left: 50%; top: 50%; width: 224px; height: 224px; transform-origin: 50% 50%; z-index: 5; cursor: pointer; }
  .dback {
    position: absolute; width: 26px; height: 50px; border-radius: 5px; border: 1px solid var(--bk-border);
    background: var(--bk-bg); box-shadow: 0 2px 4px #000b;
    transition: left .22s ease, top .22s ease, transform .22s ease, opacity .3s ease;
  }
  .dback::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 3px; background: var(--bar-bg); transform: translateY(-50%); border-radius: 2px; }
  .dback.fly { transition: transform .5s ease-in, opacity .5s ease-in; opacity: 0; }

  .toast {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px); white-space: nowrap;
    background: #000c; color: var(--text); padding: 7px 14px; border-radius: 999px; font-size: 14px; z-index: 6;
    pointer-events: none; opacity: 0; transition: opacity .2s; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }

  /* ---------- Tiles: deep violet, ivory pips, shiny gold divider ---------- */
  .tile {
    --s: 28px; display: flex; flex: none; align-items: center; justify-content: center; padding: 0; font: inherit;
    background: var(--tl-bg);
    border: 1px solid var(--tl-border); border-radius: calc(var(--s) * .22);
    box-shadow: 0 3px 5px #0009, inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -2px 0 rgba(0, 0, 0, .35);
  }
  .tile.abs { position: absolute; }
  .tile.h { flex-direction: row; width: calc(var(--s) * 2); height: var(--s); }
  .tile.v { flex-direction: column; width: var(--s); height: calc(var(--s) * 2); }
  .half { width: var(--s); height: var(--s); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: calc(var(--s) * .16); }
  .half b { width: 80%; height: 80%; margin: auto; border-radius: 50%; background: var(--pip-bg); box-shadow: 0 1px 1px #0008; }
  .half s { display: block; }
  .bar { flex: none; background: var(--bar-bg); border-radius: 2px; box-shadow: var(--bar-glow); }
  .tile.h .bar { width: 3px; height: 74%; }
  .tile.v .bar { height: 3px; width: 74%; }
  .tile.mini { --s: 18px; box-shadow: 0 1px 2px #0008; }
  .tile.last { box-shadow: 0 0 0 2px var(--gold-2), 0 0 12px rgba(255, 215, 110, .6), 0 3px 6px #000a; }
  .tile.drop { animation: drop .35s ease-out; }
  @keyframes drop { from { transform: scale(1.35); opacity: .2; } to { transform: scale(1); opacity: 1; } }

  .ghost {
    position: absolute; display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2px dashed var(--gold-1); border-radius: 7px; background: rgba(255, 233, 150, .14);
    color: var(--gold-1); font-weight: 700; font-size: 15px; padding: 0; animation: pulse 1.1s ease-in-out infinite;
  }
  .ghost::after { content: ""; position: absolute; inset: -9px; }
  @keyframes pulse { 50% { background: rgba(255, 233, 150, .34); } }

  /* ---------- Player zone ---------- */
  .mezone { display: flex; flex-direction: column; gap: 6px; }
  .status { min-height: 22px; text-align: center; font-size: 15px; font-weight: 700; }
  .status.warn { color: var(--gold-2); }
  .hand { display: flex; align-items: flex-end; gap: 7px; overflow-x: auto; overflow-y: hidden; padding: 14px 4px 8px; --s: 40px; min-height: calc(var(--s) * 2 + 24px); }
  .hand > :first-child { margin-inline-start: auto; }
  .hand > :last-child { margin-inline-end: auto; }
  .hand .tile { cursor: pointer; transition: transform .15s ease, opacity .15s ease; }
  .hand .tile.ok { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--gold-2), 0 0 12px rgba(255, 215, 110, .5), 0 6px 10px #000a; }
  .hand .tile.dim { opacity: .42; }
  .hand .tile.sel { transform: translateY(-16px); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--gold-2), 0 8px 14px #000b; }
  .hand .tile.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .act, .mbtn {
    width: 100%; border: 1px solid var(--gold-3); border-radius: 14px; padding: 13px; font-size: 18px; font-weight: 700; cursor: pointer;
    background: linear-gradient(180deg, var(--violet-700), var(--violet-800)); color: var(--text);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .15);
  }
  .act { background: var(--gold-grad); color: #2a1604; border-color: #6b4510; text-shadow: 0 1px 0 rgba(255, 240, 190, .6); }
  .act:disabled { background: var(--violet-800); color: #8d72b8; border-color: #4a2a78; text-shadow: none; cursor: default; }
  .act.alt { background: linear-gradient(180deg, var(--violet-700), var(--violet-800)); color: var(--text); text-shadow: none; border-color: var(--gold-3); }

  /* ---------- Menu ---------- */
  .menu {
    position: fixed; inset: 0; z-index: 30; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
    background: radial-gradient(110% 80% at 50% 0%, #34135c 0%, var(--violet-900) 45%, var(--night) 100%);
  }
  .menu .cone { height: 70%; opacity: .9; }
  .menu-in { position: relative; z-index: 1; width: min(100%, 400px); display: flex; flex-direction: column; gap: 12px; margin: auto; }
  .gear { position: absolute; z-index: 3; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
  .logo { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 8px; }
  .logo-tiles { display: flex; gap: 8px; --s: 24px; }
  .logo h1 { margin: 0; font-family: var(--font-logo); font-weight: 900; font-size: clamp(40px, 13vw, 64px); line-height: 1; letter-spacing: .02em; }
  .credit { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .credit::before, .credit::after { content: ""; width: 38px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-3), transparent); }
  .mbtn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: start; }
  .mbtn.primary { background: var(--gold-grad); color: #2a1604; border-color: #6b4510; text-shadow: 0 1px 0 rgba(255, 240, 190, .6); justify-content: center; font-size: 20px; }
  .mbtn small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .mbtn em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--gold-1); background: #0006; border: 1px solid var(--gold-3); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .mbtn.soon { opacity: .8; }
  .mbtn.big { padding: 18px 16px; font-size: 22px; justify-content: center; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .scr-title { text-align: center; font-family: var(--font-display); font-size: 28px; margin: 0 0 4px; color: var(--gold-2); }
  .chip { border: 1px solid #5d3a93; background: var(--violet-900); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--gold-grad); color: #2a1604; border-color: #6b4510; font-weight: 700; }

  /* ---------- Settings ---------- */
  .settings { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #08020fd9; padding: 16px; }
  .panel {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; background: linear-gradient(180deg, var(--violet-800), var(--violet-900));
    border: 2px solid var(--gold-3); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 16px 40px #000c;
  }
  .panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--gold-2); }
  .panel h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .panel .langs { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .linkbtn { margin-bottom: 8px; padding: 11px 14px; font-size: 16px; }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol input[type=range] { flex: 1; accent-color: var(--gold-2); min-width: 0; height: 28px; }
  .muted-note { margin: 0; font-size: 13px; color: var(--muted); }
  .head2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* ---------- Hand-end sheet ---------- */
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: #08020fcc; padding: 16px; }
  .sheet {
    width: min(100%, 420px); max-height: 100%; overflow-y: auto; background: linear-gradient(180deg, var(--violet-800), var(--violet-900)); border: 2px solid var(--gold-3);
    border-radius: 22px; padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px #000c;
  }
  .sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.15; }
  .sheet p { margin: 0; line-height: 1.6; }
  .reveal { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .reveal small { width: 100%; font-size: 13px; color: var(--muted); }
  .tally { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--gold-1); }
  .games { font-size: 14px; color: var(--muted); }

  /* ---------- Turn timer, tile tip, notes ---------- */
  .timer { display: flex; align-items: center; gap: 8px; height: 14px; }
  .timer.idle { visibility: hidden; }
  .timer .track { flex: 1; height: 6px; border-radius: 3px; background: #3d1a68; overflow: hidden; }
  #tbar { display: block; height: 100%; width: 100%; background: var(--gold-grad); transition: width .2s linear; }
  .timer b { font-size: 13px; min-width: 2.2ch; text-align: center; color: var(--gold-2); font-variant-numeric: tabular-nums; }
  .timer.low #tbar { background: #e0483a; }
  .timer.low b { color: #ff8a78; }
  .tip {
    position: absolute; z-index: 7; transform: translate(-50%, -100%); background: #000d; border: 1px solid var(--gold-3); color: var(--text);
    padding: 6px 10px; border-radius: 10px; font-size: 13px; white-space: nowrap; pointer-events: none; max-width: calc(100% - 12px);
  }
  .menu-note { text-align: center; background: #000a; border: 1px solid var(--gold-3); border-radius: 12px; padding: 8px 12px; font-size: 14px; color: var(--gold-1); }

  /* ---------- Dealing animation: shuffle 28 face-down tiles, spread them, each player takes 4 then 3 ---------- */
  function runDeal(cur, done) {
    var layer = $('#dealer'), felt = $('#felt');
    layer.hidden = false; layer.innerHTML = '';
    var k = Math.min(1.3, (felt.clientWidth - 16) / 230, (felt.clientHeight - 16) / 230);
    if (!(k > 0)) k = 1;
    layer.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
    var els = [], timers = [], finished = false;
    for (var i = 0; i < 28; i++) { var d = document.createElement('div'); d.className = 'dback'; layer.appendChild(d); els.push(d); }
    function at(ms, fn) {
      timers.push(setTimeout(function () {
        if (S !== cur || finished) return;
        if (cur.paused) cur.queue.push(function () { if (S === cur && !finished) fn(); }); else fn();
      }, ms));
    }
    function jumble() {
      els.forEach(function (d) {
        d.style.left = (95 + (Math.random() - .5) * 140) + 'px'; d.style.top = (87 + (Math.random() - .5) * 120) + 'px';
        d.style.transform = 'rotate(' + Math.round(Math.random() * 360) + 'deg)';
      });
      sfx('shuffle');
    }
    function spread() {
      els.forEach(function (d, i) { d.style.left = ((i % 7) * 32 + 3) + 'px'; d.style.top = (Math.floor(i / 7) * 56 + 3) + 'px'; d.style.transform = 'rotate(0deg)'; });
    }
    function finish() {
      if (finished) return;
      finished = true; timers.forEach(clearTimeout);
      layer.hidden = true; layer.innerHTML = ''; layer.onclick = null;
      done();
    }
    jumble();
    at(230, jumble); at(460, jumble); at(690, jumble);
    at(950, spread);
    var order = S.order, remaining = els.slice(), t0 = 1450, step = 210, n = 0;
    [4, 3].forEach(function (cnt) {
      order.forEach(function (p) {
        at(t0 + n * step, function () {
          var start = Math.floor(Math.random() * Math.max(1, remaining.length - cnt + 1));
          var take = remaining.splice(start, cnt);
          var fw = felt.clientWidth / k, fh = felt.clientHeight / k, dx = 0, dy = 0;
          if (p === 'me') dy = fh; else if (p === 'b' || p === 't') dy = -fh; else if (p === 'r') dx = fw; else dx = -fw;
          take.forEach(function (d) { d.classList.add('fly'); d.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(0deg)'; });
          sfx('deal');
        });
        n++;
      });
    });
    var endAt = t0 + n * step + 650;
    at(endAt - 350, function () { remaining.forEach(function (d) { d.style.opacity = '0'; }); });
    at(endAt, finish);

  function startHand() {

  function doPlay(who, x, side) {
    if (ON && who === 'me') ONsend({ t: 'p', x: [x[0], x[1]], d: side });

  function playerDraw() {

    else { ONsend({ t: 'x' }); toast(t('youPassed')); sfx('pass'); nextTurn('me'); }
  }

  function botChoose(p) {
    var e = ends(), best = null, team = teamOf(p), hand = S.hands[p];
    var opps = S.order.filter(function (q) { return teamOf(q) !== team; });
    var mate = S.order.filter(function (q) { return q !== p && teamOf(q) === team; })[0];
    hand.forEach(function (x) {
      fits(x, e).forEach(function (side) {
        var ne = newEnd(x, side, e), kept = side === 'L' ? e[1] : e[0];
        var rest = hand.filter(function (y) { return y !== x; });
        var sc = x[0] + x[1] + (x[0] === x[1] ? 2 : 0);
        sc += rest.filter(function (y) { return y[0] === ne || y[1] === ne; }).length * 1.5;
        opps.forEach(function (q) { if (S.miss[q][ne]) sc += 3; if (S.miss[q][kept]) sc += 1; });
        if (mate && S.miss[mate][ne]) sc -= 3;
        sc += Math.random() * 0.8;

  /* ---------- "Domino!" slam: the last tile leaps from the hand and crashes onto the table like a meteor ---------- */

  /* ---------- Online play with friends (Firebase: Google sign-in + Realtime Database) ----------
     Both phones run the same game. The deal comes from a shared seed, so only the moves travel over the network. */
  var FBCFG = { apiKey: 'AIzaSyBmUz01W5pU0NyVdcmOhDux-ywdVXrzWZI', authDomain: 'domino-tunisia.firebaseapp.com', databaseURL: 'https://domino-tunisia-default-rtdb.europe-west1.firebasedatabase.app', projectId: 'domino-tunisia', storageBucket: 'domino-tunisia.firebasestorage.app', messagingSenderId: '524648933508', appId: '1:524648933508:web:cec6efba4ec938729d7ad1' };

  function escH(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
  function myName() { return (eco.prof.name || (NET.user && NET.user.displayName) || 'Player').slice(0, 14); }
  function genCode() { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = ''; for (var i = 0; i < 6; i++) r += c.charAt(Math.floor(Math.random() * c.length)); return r; }
  function loadScripts(list, i, ok, bad) {
    if (i >= list.length) { ok(); return; }
    var sc = document.createElement('script'); sc.src = list[i];
    sc.onload = function () { loadScripts(list, i + 1, ok, bad); }; sc.onerror = function () { bad(); };
    document.head.appendChild(sc);
  }
  function loadFirebase() {
    if (NET.state === 'ready' || NET.state === 'loading') return;
    NET.state = 'loading'; renderLobby();
    function ready() {
      try {
        if (!firebase.apps.length) firebase.initializeApp(FBCFG);
        NET.db = firebase.database(); NET.auth = firebase.auth(); NET.state = 'ready';
        NET.auth.onAuthStateChanged(function (u) {
          NET.user = u; renderLobby();
          if (u && pendingRoom) { var c = pendingRoom; pendingRoom = ''; joinRoom(c); }
        });
      } catch (e) { NET.state = 'error'; }
      renderLobby();
    }
    if (window.firebase && firebase.database && firebase.auth) { ready(); return; }
    var names = ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js'];
    var bases = ['https://www.gstatic.com/firebasejs/10.12.2/', 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/'];
    (function tryBase(k) {
      if (k >= bases.length) { NET.state = 'error'; renderLobby(); return; }
      loadScripts(names.map(function (n) { return bases[k] + n; }), 0, ready, function () { tryBase(k + 1); });
    })(0);
  }
  function openLobby() { screen('scrOnline'); if (NET.state === 'idle' || NET.state === 'error') { NET.state = 'idle'; loadFirebase(); } renderLobby(); }
  function renderLobby() {
    var b = $('#onBody'); if (!b || $('#scrOnline').hidden) return;
    var h = '';
    var inapp = /Telegram|FBAN|FBAV|Instagram|; wv\)/i.test(navigator.userAgent || '');
    if (NET.state === 'loading' || NET.state === 'idle') h = '<div class="emptybox">' + t('on_loading') + '</div>';
    else if (NET.state === 'error') h = '<div class="emptybox">' + t('on_err') + '</div><button class="mbtn primary" id="onRetry" type="button" style="justify-content:center">' + t('on_retry') + '</button>';
    else if (!NET.user) h = '<div class="tcard"><h3>' + t('on_hello') + '</h3><button class="mbtn primary" id="onSign" type="button">G&nbsp; ' + t('on_signin') + '</button>' + (inapp ? '<div class="onwarn">' + t('on_inapp') + '</div>' : '<small>' + t('on_tip') + '</small>') + '</div>';
    else {
      var nm = escH(myName());
      h = '<div class="fcard"><div class="av">' + (NET.user.photoURL ? '<img alt="" src="' + escH(NET.user.photoURL) + '">' : escH(nm.charAt(0).toUpperCase())) + '</div><div class="inf"><b>' + nm + '</b>' + t('on_signed') + '</div><button class="gbtn" id="onOut" type="button">' + t('on_signout') + '</button></div>';
      if (NET.lobby) h += '<div class="tcard"><h3>' + t('on_code') + '</h3><div class="bigcode">' + NET.lobby.code + '</div><small>' + t('on_wait') + '</small><button class="mbtn primary" id="onShare" type="button">' + t('on_share') + '</button><button class="mbtn" id="onCancel" type="button">' + t('on_cancel') + '</button></div>';
      else h += '<div class="tcard"><button class="mbtn primary" id="onCreate" type="button">' + t('on_create') + '</button><div class="onor">' + t('on_or') + '</div><input class="onin" id="onCode" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="' + t('on_ph') + '"><button class="mbtn" id="onJoin" type="button">' + t('on_join') + '</button></div>';
    }
    b.innerHTML = h;
  }
  function signIn() {
    var prov = new firebase.auth.GoogleAuthProvider();
    NET.auth.signInWithPopup(prov).catch(function (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) NET.auth.signInWithRedirect(prov);
      else if (!(e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'))) shopNote(t('on_err'));
    });
  }
  function createRoom() {
    if (!NET.user || NET.lobby || ON) return;
    var code = genCode(), ref = NET.db.ref('rooms/' + code);
    ref.once('value').then(function (sn) {
      if (sn.exists()) { createRoom(); return null; }
      return ref.set({ host: NET.user.uid, hn: myName(), st: 'wait', seed: 1 + Math.floor(Math.random() * 2147483000), t: Date.now() }).then(function () { enterRoom(code, 0); });
    }).catch(function () { shopNote(t('on_err')); });
  }
  function joinRoom(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    if (code.length < 6 || !NET.user || NET.lobby || ON) return;
    var ref = NET.db.ref('rooms/' + code), me = NET.user.uid;
    ref.once('value').then(function (sn) {
      var v = sn.val();
      if (!v) { shopNote(t('on_notfound')); return null; }
      if (v.host === me || (v.guest && v.guest !== me)) { shopNote(t('on_full')); return null; }
      return ref.child('guest').transaction(function (cur) { if (cur === null || cur === me) return me; return undefined; }).then(function (r) {
        if (!r.committed) { shopNote(t('on_full')); return null; }
        return ref.update({ gn: myName(), st: 'play' }).then(function () { enterRoom(code, 1); });
      });
    }).catch(function () { shopNote(t('on_err')); });
  }
  function enterRoom(code, seat) {
    var ref = NET.db.ref('rooms/' + code), me = NET.user.uid;
    ON = { code: code, seat: seat, ref: ref, uid: me, hn: 0, q: {}, started: false, applying: false, seenOpp: false, left: false, oppName: '', seed: 0 };
    NET.lobby = { code: code };
    ref.child('pr/' + me).set(true); ref.child('pr/' + me).onDisconnect().remove();
    ref.child('mv').on('child_added', onMoveSnap);
    ref.child('ch').on('child_added', onChatSnap);
    ref.child('pr').on('value', onPres);
    ref.on('value', onRoomVal);
    renderLobby();
  }
  function ONleave() {
    if (!ON) return;
    var o = ON; ON = null; NET.lobby = null;
    try {
      o.ref.child('mv').off(); o.ref.child('ch').off(); o.ref.child('pr').off(); o.ref.off();
      o.ref.child('pr/' + o.uid).remove();
      if (!o.started || o.left) o.ref.remove();
    } catch (e) {}
  }
  function ONsend(mv) {
    if (!ON) return;
    mv.s = ON.seat; mv.h = ON.hn;
    try { ON.ref.child('mv').push(mv); } catch (e) {}
  }
  function onRoomVal(sn) {
    if (!ON) return;
    var v = sn.val();
    if (!v) { if (ON.started && !ON.left) endOnline(t('on_left'), t('on_left2')); return; }
    if (v.st === 'play' && !ON.started) {
      ON.started = true; ON.seed = v.seed; ON.oppName = (ON.seat === 0 ? v.gn : v.hn) || '';
      shopNote(t('on_started'));
      $('#menu').hidden = true; startMatch('1v1');
    }
  }
  function onPres(sn) {
    if (!ON) return;
    var n = Object.keys(sn.val() || {}).length;
    if (n >= 2) ON.seenOpp = true;
    else if (ON.seenOpp && ON.started && !ON.left) endOnline(t('on_left'), t('on_left2'));
  }
  function onMoveSnap(sn) {
    var v = sn.val(); if (!ON || !v || v.s === ON.seat) return;
    (ON.q[v.h] = ON.q[v.h] || []).push(v);
    onPump();
  }
  function onChatSnap(sn) {
    var v = sn.val(); if (!ON || !v || v.s === ON.seat || !S || !M) return;
    botSay('b', String(v.txt || '').slice(0, 120));
  }
  function endOnline(title, text) {
    if (!ON || ON.left) return;
    ON.left = true;
    if (!S || !M) return;
    M.done = true; S.over = true; stopTimer(); hideTip();
    $('#lock').hidden = true; $('#slam').hidden = true; $('#pause').hidden = true; closeChat();
    $('#ovTitle').textContent = title; $('#ovText').textContent = text; $('#ovTally').textContent = ''; $('#ovGames').textContent = ''; $('#ovReveal').innerHTML = '';
    var btn = $('#ovBtn'); $('#ovBtn2').hidden = true;
    btn.textContent = t('toMenu'); btn.onclick = function () { ONleave(); $('#overlay').hidden = true; showMenu(); };
    $('#overlay').hidden = false;
  }
  /* The opponent's moves are replayed here, one at a time, when it is their turn. */
  function onPump() {
    if (!ON || !S || !M || S.over || S.dealing || ON.applying) return;
    var q = ON.q[ON.hn]; if (!q || !q.length) return;
    var mv = q[0], cur = S;
    if (cur.locking) {
      if (cur.lockTeam === 'B' && mv.t === 'l' && cur.lockPick) {
        q.shift(); ON.applying = true;
        $('#lkSub').textContent = t(mv.k === 'blind' ? 'lock_blind_by' : 'lock_aware_by', seatName('b'));
        later(cur, function () { ON.applying = false; if (S === cur && !cur.over) cur.lockPick(mv.k); }, 1500);
      }
      return;
    }
    if (cur.turn !== 'b') return;
    q.shift(); ON.applying = true;
    later(cur, function () {
      if (!ON) return;
      ON.applying = false;
      if (S !== cur || cur.over) return;
      if (mv.t === 'p') {
        var x = cur.hands.b.filter(function (y) { return (y[0] === mv.x[0] && y[1] === mv.x[1]) || (y[0] === mv.x[1] && y[1] === mv.x[0]); })[0];
        if (!x) { endOnline(t('on_left'), t('on_desync')); return; }
        doPlay('b', x, mv.d);
      } else if (mv.t === 'd') {
        markMiss('b'); if (cur.bone.length) cur.hands.b.push(cur.bone.pop());
        toast(t('drew', seatName('b'))); sfx('pass'); render(); onPump();
      } else if (mv.t === 'x') {
        markMiss('b'); toast(t('passed', seatName('b'))); sfx('pass'); nextTurn('b');
      }
    }, 700);
  }
  $('#onBody').addEventListener('click', function (ev) {
    var id = (ev.target.closest('button') || {}).id;

})();
